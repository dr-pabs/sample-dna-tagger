[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-dna-tagger"
version = "0.1.0"
description = "AI-tag your sample library. Find anything with natural language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Brown", email = "paul@example.com" }]
keywords = ["audio", "sample-library", "music-production", "ai-tagging"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.2",
    "librosa>=0.10.2",
    "essentia>=2.1b6.dev1203",
    "openai>=1.55.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "python-multipart>=0.0.12",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "pydantic>=2.9",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1",
    "watchdog>=6.0",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
sample-dna-tagger = "sample_dna_tagger.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sample_dna_tagger*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
